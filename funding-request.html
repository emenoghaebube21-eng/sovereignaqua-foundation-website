<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funding Request | SovereignAqua Imperium-Habour</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-page"><div class="auth-card wide"><div class="eyebrow">DONATION / GRANT INTAKE</div><h1>Funding request</h1><p>This form is an intake interface. Production deployment must submit data to a secured backend and payment/grant-processing workflow.</p><form id="fundingForm" class="form-grid"><label>Name / organization<input required name="donor"></label><label>Email<input required type="email" name="email"></label><label>Funding type<select name="type"><option>Voluntary donation</option><option>Project-restricted donation</option><option>Voluntary grant</option><option>Institutional grant</option><option>In-kind support</option></select></label><label>Currency<input required name="currency" maxlength="8" placeholder="USD"></label><label>Amount<input required type="number" min="0" step="0.01" name="amount"></label><label>Project / program<input required name="project"></label><label class="full">Funding purpose<textarea required name="purpose" rows="5"></textarea></label><label class="full check"><input required type="checkbox"> I understand this is an intake request and that acceptance, restrictions, processing, reporting and any tax treatment depend on the receiving entity and applicable requirements.</label><button class="button primary" type="submit">Submit funding request</button><p id="fundingMessage" class="form-message"></p></form><a class="text-link" href="donate.html">← Return to funding page</a></div></main><script src="app.js"></script></body></html>
