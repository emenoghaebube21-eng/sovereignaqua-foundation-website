<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Onboarding | SovereignAqua Global Institute</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-page"><div class="auth-card wide"><div class="eyebrow">GLOBAL INSTITUTE</div><h1>Register an organization</h1><p>Create an institutional profile for an NGO, nonprofit, foundation, humanitarian entity, research institution, community organization or social-impact organization.</p><form class="form-grid" id="orgForm"><label>Organization name<input required name="name"></label><label>Organization type<select name="type"><option>NGO</option><option>Nonprofit</option><option>Foundation</option><option>Humanitarian organization</option><option>Research institution</option><option>Community organization</option><option>Social-impact enterprise</option><option>Other</option></select></label><label>Country / jurisdiction<input required name="country"></label><label>Region<select name="region"><option>Africa</option><option>Asia-Pacific</option><option>Europe</option><option>Middle East</option><option>North America</option><option>Latin America & Caribbean</option></select></label><label>Official website<input type="url" name="website"></label><label>Primary contact email<input required type="email" name="email"></label><label class="full">Mission / purpose<textarea required name="mission" rows="5"></textarea></label><label class="full check"><input required type="checkbox"> I confirm that the information submitted is accurate to the best of my knowledge and understand that registration does not itself confer legal or accreditation status.</label><button class="button primary" type="submit">Submit organization</button><p id="orgMessage" class="form-message"></p></form><a class="text-link" href="global.html">← Global Institute</a></div></main><script src="app.js"></script></body></html>
