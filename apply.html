<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership Application | SovereignAqua Imperium-Habour PMA</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-page"><div class="auth-card wide"><div class="eyebrow">MEMBERSHIP INTAKE</div><h1>Membership application</h1><p>Submit an initial application for administrative review. Acceptance is subject to the PMA's governing instruments and applicable requirements.</p><form id="applicationForm" class="form-grid"><label>Full name<input required name="name"></label><label>Email<input required type="email" name="email"></label><label>Country / jurisdiction<input required name="jurisdiction"></label><label>Area of interest<select name="interest"><option>Water systems</option><option>Environmental stewardship</option><option>Research & development</option><option>Infrastructure</option><option>Humanitarian logistics</option></select></label><label class="full">Purpose / background<textarea required name="purpose" rows="6"></textarea></label><label class="full check"><input required type="checkbox"> I acknowledge that submission is an application for review and does not itself create membership.</label><button class="button primary" type="submit">Submit application</button><p id="applicationMessage" class="form-message"></p></form><a class="text-link" href="index.html">← Return to public site</a></div></main><script src="app.js"></script></body></html>
